# The pwsh terminal-card lane swaps the shipped bash executor for the PowerShell
# twin: the bash-local row is disabled and the host pwsh-local row is enabled by
# id, so the pwsh executor is the lone `ctx.shell` on every platform. The
# seeded scenario renders the logged pwsh call/result through the real tools on
# replay; no command executes, but the composition must boot the pwsh executor,
# so the lane skips on hosts without a usable `pwsh`.
- id: bash-local
  name: '@deepseek-ai/dsh-bash-local'
  disabled: true
- id: pwsh-local
  name: '@deepseek-ai/dsh-pwsh-local'
  disabled: false

# tool-pwsh already exists in the shipped composition: the base bundle declares
# it platform-gated on every platform, and the web-app overlay disables it for
# surfaces that use presets. So this lane enables it by id rather than
# inserting a second row to the same id.
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: false
